<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSDS 개정 지원</title>
<style>
  :root {
    --bg: #F6F7F9; --surface: #FFFFFF; --ink: #16191F; --ink-2: #3E4450; --muted: #5B6270; --line: #E2E5EA;
    --line-2: #C9CED6; --accent: #0B5E5E; --accent-soft: #E7F2F2; --blue: #1D4F91; --blue-soft: #E3EDFB;
    --amber: #9A4A06; --amber-soft: #FDF3E7; --green: #2F6B3A; --green-soft: #E8F3EA; --red: #A12A1E; --red-soft: #FBECEA;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  code, .mono { font-family: Consolas, "IBM Plex Mono", monospace; font-size: 12.5px; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; padding: 12px 0; }
  .logo { width: 32px; height: 32px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
  .tabs { display: flex; gap: 4px; align-self: stretch; flex-wrap: wrap; }
  .tab { display: inline-flex; align-items: center; gap: 8px; min-height: 56px; padding: 0 16px; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--muted); cursor: pointer; }
  .tab[aria-selected="true"] { border-bottom-color: var(--accent); color: var(--ink); font-weight: 700; }
  .badge { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--amber); color: #fff; font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; }
  main { max-width: 1320px; margin: 0 auto; padding: 24px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .card h2 { margin: 0 0 10px; font-size: 16px; }
  .btn { height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .muted { color: var(--muted); font-size: 13px; }
  label.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; color: var(--muted); }
  select, input[type=text], textarea { border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); padding: 0 12px; }
  select, input[type=text] { height: 44px; }
  textarea { padding: 10px 12px; resize: vertical; min-height: 64px; width: 100%; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; }
  .pill.blue { background: var(--blue-soft); color: var(--blue); }
  .pill.amber { background: var(--amber-soft); color: var(--amber); }
  .pill.green { background: var(--green-soft); color: var(--green); }
  .pill.red { background: var(--red-soft); color: var(--red); }
  .pill.gray { background: #EEF0F3; color: var(--ink-2); }
  .answer { white-space: pre-wrap; line-height: 1.75; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .stat .v { font-size: 26px; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px 12px; text-align: left; border-top: 1px solid var(--line); vertical-align: top; }
  thead th { background: var(--bg); border-top: 0; color: var(--ink-2); }
  .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  details { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--surface); }
  details + details { margin-top: 8px; }
  summary { cursor: pointer; font-weight: 500; }
  .ctx { border-top: 1px solid var(--line); padding: 8px 0; }
  .ctx:first-of-type { border-top: 0; }
  .ctx pre { margin: 6px 0 0; white-space: pre-wrap; font: 13px/1.6 inherit; color: var(--ink-2); max-height: 220px; overflow: auto; }
  .notice { border-radius: 10px; padding: 12px 14px; font-size: 14px; }
  .notice.err { background: var(--red-soft); color: var(--red); }
  .notice.wait { background: var(--amber-soft); color: var(--amber); }
  .notice.info { background: var(--accent-soft); color: var(--accent); }
  .spinner { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block; animation: spin .8s linear infinite; vertical-align: -3px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .chat { display: flex; flex-direction: column; gap: 14px; }
  .bubble-q { align-self: flex-end; max-width: 640px; background: var(--ink); color: #fff; padding: 10px 14px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap; }
  .bubble-a { max-width: 860px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; min-height: 36px; }
  .composer { display: flex; gap: 8px; align-items: flex-end; margin-top: 16px; }
  .list-item { display: flex; flex-direction: column; gap: 3px; width: 100%; padding: 12px 14px; border: 0; border-left: 4px solid transparent; border-top: 1px solid var(--line); background: var(--surface); text-align: left; cursor: pointer; }
  .list-item[aria-current="true"] { border-left-color: var(--accent); background: var(--accent-soft); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.2); z-index: 10; }
  .hidden { display: none !important; }
  /* 대시보드·MSDS 문서·변경 전후 비교 (2026-11-12 추가) */
  .event-card { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 12px; font-size: 14px; }
  .event-card dt { color: var(--muted); }
  .event-card dd { margin: 0; }
  .mark { display: inline-block; min-width: 28px; text-align: center; font-weight: 700; }
  .doc { display: flex; flex-direction: column; gap: 12px; }
  .doc h3 { margin: 0 0 4px; font-size: 14px; color: var(--ink-2); }
  .doc .sec { border-top: 1px solid var(--line); padding-top: 10px; }
  .doc .sec:first-child { border-top: 0; padding-top: 0; }
  .doc ul { margin: 0; padding-left: 18px; }
  .del { background: var(--red-soft); color: var(--red); text-decoration: line-through; border-radius: 4px; padding: 0 3px; }
  .add { background: var(--green-soft); color: var(--green); font-weight: 700; border-radius: 4px; padding: 0 3px; }
  .compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 860px) { .compare { grid-template-columns: minmax(0, 1fr); } }
  .linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; font-size: 13px; min-height: 28px; }
  @media (max-width: 720px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } main { padding: 16px; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/></svg></div>
    <strong>MSDS 개정 지원</strong>
    <span class="muted">(가상) 한빛케미칼</span>
  </div>
  <nav class="tabs" role="tablist" aria-label="화면">
    <button class="tab" role="tab" data-tab="impact" aria-selected="true">영향 분석</button>
    <button class="tab" role="tab" data-tab="msds" aria-selected="false">제품 MSDS</button>
    <button class="tab" role="tab" data-tab="chat" aria-selected="false">어시스턴트</button>
    <button class="tab" role="tab" data-tab="review" aria-selected="false">승인함 <span id="badge" class="badge hidden">0</span></button>
  </nav>
</header>

<main>
  <!-- 영향 분석 -->
  <section id="tab-impact">
    <div class="row" style="justify-content: space-between; align-items: flex-end; margin-bottom: 16px">
      <div class="row" style="align-items: flex-end">
        <label class="field">변경 사건
          <select id="event" style="min-width: 360px; max-width: 100%"></select>
        </label>
        <!-- (기존 코드) <button id="run-impact" class="btn primary">영향 분석 실행</button> — 대시보드가 기본 표시되므로 AI 판정 버튼으로 이름 변경 -->
        <button id="run-impact" class="btn primary">AI 판정·개정 초안 만들기</button>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
        <button id="refresh-laws" class="btn">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
          <span>법령 가져오기</span>
        </button>
        <span id="laws-asof" class="muted"></span>
      </div>
    </div>
    <div id="refresh-result" class="card hidden" style="margin-bottom: 16px"></div>
    <!-- 대시보드 (규칙 기반, AI 없이 바로 표시) -->
    <div id="dashboard" style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px"></div>
    <div id="impact-status"></div>
    <div id="impact-result" class="hidden" style="display: flex; flex-direction: column; gap: 16px"></div>
    <!-- (기존 코드) 사용 방법 카드를 기본 표시 — 대시보드가 생겨 숨김 처리 -->
    <div id="impact-empty" class="card hidden">
      <h2>사용 방법</h2>
      <ol class="muted" style="margin: 0; padding-left: 18px">
        <li>변경 사건을 고르고 <b>영향 분석 실행</b>을 누르면 영향 제품, 고칠 항목, 재제출 여부를 근거 조문과 함께 보여 줍니다.</li>
        <li>고칠 MSDS가 있으면 개정 초안이 <b>승인함</b>에 올라갑니다.</li>
        <li>법령이 개정됐다면 먼저 <b>법령 가져오기</b>로 최신 조문을 받으세요.</li>
      </ol>
    </div>
  </section>

  <!-- 제품 MSDS 조회 -->
  <section id="tab-msds" class="hidden">
    <div class="row">
      <nav class="card" style="flex: 1 1 260px; max-width: 320px; padding: 0; overflow: hidden" aria-label="제품 목록">
        <div class="muted" style="padding: 14px 16px">제품 MSDS (영업비밀·연락처는 가려서 표시)</div>
        <div id="msds-list"></div>
      </nav>
      <div id="msds-detail" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px"></div>
    </div>
  </section>

  <!-- 어시스턴트 -->
  <section id="tab-chat" class="hidden">
    <div id="chat" class="chat"></div>
    <div id="chips" class="chips" style="margin-top: 12px"></div>
    <div class="composer">
      <label for="ask" class="hidden">질문</label>
      <textarea id="ask" rows="2" placeholder="MSDS·법령·제품 질문을 입력하세요 (Enter 보내기, Shift+Enter 줄바꿈)"></textarea>
      <button id="send" class="btn primary" style="height: 64px">보내기</button>
    </div>
  </section>

  <!-- 승인함 -->
  <section id="tab-review" class="hidden">
    <div class="row">
      <nav class="card" style="flex: 1 1 280px; max-width: 360px; padding: 0; overflow: hidden" aria-label="승인 요청 목록">
        <div class="muted" style="padding: 14px 16px" id="review-count"></div>
        <div id="review-list"></div>
      </nav>
      <div id="review-detail" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px"></div>
    </div>
  </section>
</main>
<div id="toast" class="toast hidden" role="status"></div>

<script>
const BOOT = /*__BOOT__*/null || { updates: [], products: [], laws: [], lawsAsOf: "" };
const $ = (s) => document.querySelector(s);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let reqs = store.get("msds.reqs", []);
let activeReq = null;

function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.remove("hidden");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add("hidden"), 3500);
}

// ---------------------------------------------------------------- 서버 호출 (POST /query 하나만 사용)
async function ask(question) {
  try {
    const r = await fetch("/query", { method: "POST", headers: { "Content-Type": "application/json" },
                                      body: JSON.stringify({ question }) });
    const body = await r.json().catch(() => null);
    if (!r.ok || !body) return { ok: false, body, error: (body && body.answer) || `서버 오류 (HTTP ${r.status})` };
    return { ok: true, body };
  } catch (e) {
    return { ok: false, error: "서버에 연결할 수 없습니다. 서버가 켜져 있는지 확인하세요." };
  }
}
function waiting(container, text) {
  const start = Date.now();
  const box = h("div", { class: "notice wait" }, h("span", { class: "spinner" }), " ", text, " ", h("span", {}, "0초"));
  container.replaceChildren(box);
  const timer = setInterval(() => { box.lastChild.textContent = `${Math.round((Date.now() - start) / 1000)}초`; }, 500);
  return () => { clearInterval(timer); container.replaceChildren(); };
}
function errorBox(msg) {
  return h("div", { class: "notice err" }, msg,
    h("div", { class: "muted", style: "margin-top: 4px" }, "AI 사용 한도 초과나 일시적인 오류일 수 있습니다. 잠시 후 다시 시도해 주세요."));
}

// ---------------------------------------------------------------- 응답 해석
const pendingReq = (body) => (body.trace.find((t) => t.step === "hitl_interrupt") || {}).input || null;
function judgmentOf(body) {
  const t = body.trace.find((s) => s.step === "revision_judgment");
  try { return t ? JSON.parse(t.output) : null; } catch { return null; }
}
function ctxKind(c) {
  if (c.doc_id.startsWith("law:")) return c.text.startsWith("[시행 예정") ? ["시행 예정", "amber"] : ["현행 법령", "green"];
  if (c.doc_id.startsWith("msds:")) return ["제품 MSDS", "blue"];
  if (c.doc_id.startsWith("update:")) return ["변경 사건", "gray"];
  if (c.doc_id.startsWith("substance:")) return ["물질 정보", "blue"];
  // (추가 2026-11-12) 규칙 판정·서비스 정책 근거
  if (c.doc_id.startsWith("rule:")) return ["규칙 판정", "blue"];
  if (c.doc_id.startsWith("policy:")) return ["서비스 정책", "gray"];
  return ["목록", "gray"];
}
function contextsView(contexts, open = false) {
  if (!contexts.length) return null;
  const laws = contexts.filter((c) => c.doc_id.startsWith("law:")).length;
  return h("details", { open },
    h("summary", {}, `근거 ${contexts.length}건 (법령 조문 ${laws}건)`),
    contexts.map((c) => { const [label, color] = ctxKind(c);
      // (기존 코드) 근거 원문(JSON 포함)을 그대로 표시 — 종류별로 읽기 좋게 바꾸는 prettyContext 로 교체
      // return h("div", { class: "ctx" }, h("span", { class: `pill ${color}` }, label), " ", h("code", {}, c.doc_id),
      //   h("pre", {}, c.text)); }));
      return h("div", { class: "ctx" }, h("span", { class: `pill ${color}` }, label), " ", h("code", {}, c.doc_id),
        prettyContext(c)); }));
}
function traceView(trace) {
  return h("details", {}, h("summary", {}, `처리 단계 ${trace.length}개`),
    h("ol", { class: "muted", style: "margin: 6px 0 0; padding-left: 18px" },
      trace.map((t) => h("li", {}, h("code", {}, t.step), " — ", t.output.slice(0, 160)))));
}
function addPending(id, question, body) {
  if (!id || reqs.some((r) => r.id === id)) return;
  reqs.unshift({ id, question, status: "pending", answer: body.answer, contexts: body.contexts,
                 judgment: judgmentOf(body), createdAt: new Date().toISOString() });
  store.set("msds.reqs", reqs); renderBadge();
}

// ---------------------------------------------------------------- 탭
// (기존 코드) 탭 3개 — '제품 MSDS' 탭 추가로 교체
// function showTab(name) {
//   document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
//   for (const n of ["impact", "chat", "review"]) $(`#tab-${n}`).classList.toggle("hidden", n !== name);
//   if (name === "review") renderReview();
// }
function showTab(name) {
  document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
  for (const n of ["impact", "msds", "chat", "review"]) $(`#tab-${n}`).classList.toggle("hidden", n !== name);
  if (name === "review") renderReview();
  if (name === "msds") renderMsdsTab();
}
document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => showTab(b.dataset.tab)));
function renderBadge() {
  const n = reqs.filter((r) => r.status === "pending").length;
  $("#badge").textContent = n; $("#badge").classList.toggle("hidden", n === 0);
}

// ---------------------------------------------------------------- 영향 분석
for (const u of BOOT.updates) $("#event").append(h("option", { value: u.id }, `${u.id} · ${u.type} · ${u.title}`));
function renderLawsAsOf() {
  const d = store.get("msds.lawsRefreshed", null) || BOOT.lawsAsOf;
  $("#laws-asof").textContent = d ? `법령 기준: ${d} 국가법령정보센터에서 가져옴` : "";
}
$("#run-impact").addEventListener("click", async () => {
  const id = $("#event").value;
  const u = BOOT.updates.find((x) => x.id === id);
  const q = `${id} 변경 사건을 반영하려면 어떤 제품의 MSDS를 어떻게 고쳐야 하고, 공단에 다시 제출해야 하나요?`;
  $("#impact-empty").classList.add("hidden"); $("#impact-result").classList.add("hidden");
  $("#run-impact").disabled = true;
  const stop = waiting($("#impact-status"), `${id} 영향을 분석하고 있습니다. 보통 15~40초 걸립니다.`);
  const r = await ask(q);
  stop(); $("#run-impact").disabled = false;
  if (!r.ok) { $("#impact-status").replaceChildren(errorBox(r.error)); return; }
  const body = r.body, j = judgmentOf(body), req = pendingReq(body);
  addPending(req, q, body);
  const out = $("#impact-result"); out.replaceChildren(); out.classList.remove("hidden");
  const products = (j && j.products) || [];
  const resub = products.filter((p) => p.resubmission_required).length;
  out.append(h("div", { class: "stats" },
    stat("변경 사건", u ? u.type : id), stat("개정 필요 제품", products.length, "var(--blue)"),
    stat("재제출 대상", resub, "var(--amber)"), stat("승인 상태", req ? "승인 대기" : "해당 없음", req ? "var(--amber)" : "var(--ink-2)")));
  if (req) out.append(h("div", { class: "notice info" }, `개정 초안이 승인함에 올라갔습니다 (${req}). `,
    h("button", { class: "btn", style: "height: 36px; margin-left: 8px", onclick: () => { activeReq = req; showTab("review"); } }, "승인함에서 검토")));
  if (products.length) {
    out.append(h("div", { class: "card" }, h("h2", {}, "제품별 고칠 항목"),
      h("div", { class: "scroll" }, h("table", {},
        h("thead", {}, h("tr", {}, h("th", {}, "제품"), h("th", {}, "고칠 항목"), h("th", {}, "바꿀 내용"), h("th", {}, "공단 재제출"))),
        h("tbody", {}, products.map((p) => h("tr", {},

  else if (/승인 대기 건이 없습니다/.test(a)) { r.status = "missing"; toast("서버에 이 요청의 승인 대기 기록이 없습니다."); }

// ---------------------------------------------------------------- 승인함: 변경 전후 MSDS
function reviewCompare(r) {
  const uids = [...new Set((r.question.match(/U-\d+/gi) || []).map((x) => x.toUpperCase()))];
  if (!uids.length) return null;
  let pids = ((r.judgment || {}).products || []).map((p) => p.product_id);
  if (!pids.length) pids = [...new Set(uids.flatMap((u) => (BOOT.assess[u] || { affected: [] }).affected.map((x) => x.product_id)))];
  const views = pids.map((pid) => ({ pid, ops: opsFor(uids, pid) })).filter((x) => x.ops.length);
  if (!views.length) return null;
  const label = r.status === "approved" ? "변경 후 · 확정본" : null;
  // (기존 코드) views.map((x) => compareView(x.pid, x.ops, label ? { afterLabel: label } : {}))  — 입력한 대체 표기를 반영하도록 교체
  return h("div", { style: "display: flex; flex-direction: column; gap: 12px" },
    views.map((x) => compareView(x.pid, x.ops, { ...(label ? { afterLabel: label } : {}), inputs: r.inputs || {} })));
}
// 승인 요청에서 담당자 입력이 필요한 '확인 필요' 항목 (서버 msds_revision.required_inputs 와 같은 기준)
function requiredInputs(r) {
  const uids = [...new Set((r.question.match(/U-\d+/gi) || []).map((x) => x.toUpperCase()))];
  const pids = ((r.judgment || {}).products || []).map((p) => p.product_id);
  const out = [];
  for (const u of uids) for (const [pid, ops] of Object.entries(BOOT.ops[u] || {})) {
    if (pids.length && !pids.includes(pid)) continue;
    for (const op of ops) if (op.needs_input && ((BOOT.msds[pid] || {}).section15 || {})[op.law]?.includes(op.value))
      out.push({ key: `${pid}:${op.section}`, pid, section: op.section, law: op.law, old: op.value, suggest: op.suggest, reason: op.reason, source: op.suggest_source });
  }
  return out;
}

const LAW_NAME = { "산안법": "산업안전보건법", "산안법시행규칙": "산업안전보건법 시행규칙", "화관법": "화학물질관리법" };
function lawLabel(docId) {
  const m = /^law:([^:]+):(\d+)(?:의(\d+))?(?:@(\d{4}-\d{2}-\d{2}))?$/.exec(docId);
  if (!m) return docId;
  return `${LAW_NAME[m[1]] || m[1]} 제${m[2]}조${m[3] ? "의" + m[3] : ""}${m[4] ? ` (${m[4]} 시행 예정)` : ""}`;
}
function opText(pid, op) {
  if (op.op === "set" && op.field === "name") return `${pid} · 1번 제품명: ${op.before} → ${op.after}`;
  if (op.op === "component") return `${pid} · 3번 ${op.name} 함유량: ${op.before} → ${op.after}`;
  if (op.op === "add") return `${pid} · 2번 유해성 분류 추가: ${op.value}`;
  if (op.op === "remove") return `${pid} · 15번 ${op.law}: '${op.value}' 표기 삭제 (대체 표기 확인 필요)`;
  // '확인 필요'(replace) 작업 — 추천 문구와 함께 표시 (2026-11-12, JSON 그대로 보이던 문제 수정)
  if (op.op === "replace") return `${pid} · ${op.section}번 ${op.law}: '${op.value}' → 대체 표기 확인 필요 (추천: ${op.suggest})`;

  // return `${pid} · ${JSON.stringify(op)}`;
  return `${pid} · ${op.section ? op.section + "번 " : ""}변경 (${op.op})`;
}

// ---------------------------------------------------------------- 서버의 승인 대기 건 불러오기 (2026-11-12 추가)
// 다른 브라우저에서 만들었거나 평가 중에 생긴 승인 대기 건도 승인함에 보이게 합니다.
// 이 브라우저에 '대기'로 남아 있지만 서버에는 더 이상 대기 상태가 아닌 건은 '서버에 없음'으로 표시합니다.
function syncPending() {
  const server = BOOT.pending || [];
  const serverIds = new Set(server.map((p) => p.id));
  let added = 0;
  for (const p of server) {
    if (!reqs.some((r) => r.id === p.id)) { reqs.push(p); added++; }
  }
  for (const r of reqs) if (r.status === "pending" && BOOT.pending && !serverIds.has(r.id)) r.status = "missing";
  reqs.sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
  store.set("msds.reqs", reqs);
  return added;
}
